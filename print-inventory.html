<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Media Inventory — My Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F2ED;
  --surface: #FFFFFF;
  --surface2: #EFECE6;
  --surface3: #E8E4DC;
  --border: #DDD9D0;
  --border2: #CBC7BE;
  --text: #1C1A17;
  --text2: #6B6760;
  --text3: #9E9B95;
  --accent: #B85C2A;
  --accent-bg: #F5EAE3;
  --accent2: #2A6B8A;
  --accent2-bg: #E3EEF5;
  --green: #3A6B10;
  --green-bg: #EAF3DE;
  --red: #A12B2B;
  --red-bg: #FCEBEB;
  --amber: #835010;
  --amber-bg: #FAEEDA;
  --purple: #5B3FA0;
  --purple-bg: #EEEDFE;
  --teal: #0F6E56;
  --teal-bg: #E1F5EE;
  --r: 8px;
  --rl: 14px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
  --shadow2: 0 4px 20px rgba(0,0,0,0.10);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.app{display:flex;flex-direction:column;min-height:100vh}

header{background:var(--surface);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 1.5rem;gap:1rem;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.logo{font-family:'Playfair Display',serif;font-size:20px;letter-spacing:-0.2px;white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}
.back-link{font-family:'Jost',sans-serif;font-size:13px;font-weight:500;color:var(--text2);text-decoration:none;padding:6px 10px;border-radius:var(--r);transition:all .15s}
.back-link:hover{background:var(--surface2);color:var(--text)}
.pagename{font-size:13px;color:var(--text3);white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);background:var(--surface2);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

main{flex:1;padding:1.5rem;max-width:1500px;margin:0 auto;width:100%}

.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:var(--r);margin-bottom:1.25rem;max-width:420px}
.tab-btn{flex:1;padding:8px 8px;border:none;background:transparent;border-radius:6px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tab-btn:hover:not(.active){background:rgba(255,255,255,0.5)}

.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:10px;flex-wrap:wrap}
.sec-hd h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:400}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem;box-shadow:var(--shadow)}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px}
.stat-value{font-family:'Playfair Display',serif;font-size:28px;line-height:1}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.amber{color:var(--amber)}
.stat-value.accent{color:var(--accent)}

.toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
input,select,textarea{font-family:'Jost',sans-serif;font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,92,42,0.12)}
textarea{height:64px;resize:vertical}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap input{padding-left:32px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}

button{font-family:'Jost',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--surface2)}
button:active{transform:scale(0.98)}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button.primary:hover{background:#a04f24}
button.danger{color:var(--red)}
button.danger:hover{background:var(--red-bg);border-color:var(--red)}
button.sm{padding:4px 10px;font-size:12px}
button.ghost{border:none;background:transparent;color:var(--text2)}
button.ghost:hover{background:var(--surface2);color:var(--text)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;min-width:1300px}
th{background:var(--surface2);padding:9px 10px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf8f5}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)}
.stock-low{color:var(--red);font-weight:600}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;margin:1px 2px 1px 0;white-space:nowrap}
.b-instock{background:var(--green-bg);color:var(--green)}
.b-orderin{background:var(--amber-bg);color:var(--amber)}
.b-discontinued{background:var(--surface3);color:var(--text3)}
.b-other{background:var(--accent2-bg);color:var(--accent2)}

.overlay{display:none;position:fixed;inset:0;background:rgba(15,12,8,0.55);z-index:200;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--rl);width:min(640px,100%);border:1px solid var(--border);box-shadow:var(--shadow2);flex-shrink:0}
.modal-hd{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hd h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:400}
.modal-bd{padding:1.25rem 1.5rem;max-height:65vh;overflow-y:auto}
.modal-ft{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--surface2)}

.sec-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sec-label:first-child{margin-top:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fg label,.fl label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--text2)}
.fl{margin-bottom:10px}

.calc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.pb-label{font-size:11px;color:var(--text3);margin-bottom:3px}
.pb-val{font-family:'Playfair Display',serif;font-size:20px}

.empty{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:0.4}
.empty-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--text2);margin-bottom:6px}

.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:3rem;color:var(--text3)}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:white;padding:10px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}

@media(max-width:640px){
  main{padding:1rem}
  .fg{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">My <em>Shop</em></div>
  <a class="back-link" href="index.html">‹ Menu</a>
  <div class="pagename">Print Media Inventory</div>
  <div class="header-right">
    <div class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncTxt">Connected</span></div>
  </div>
</header>

<main>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dtf',this)">DTF Transfers</button>
    <button class="tab-btn" onclick="switchTab('uv',this)">UV Stickers</button>
  </div>

  <div class="sec-hd">
    <h2 id="page-title">DTF Transfers</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" onclick="refreshTab()">⟳ Refresh</button>
      <button class="primary" onclick="openModal()">+ Add SKU</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search-wrap"><span class="search-icon">⌕</span><input type="text" id="search" placeholder="Search SKU, design, supplier, notes…" oninput="render()"></div>
    <select id="status-filter" onchange="render()" style="width:auto">
      <option value="">All statuses</option>
    </select>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);white-space:nowrap">
      <input type="checkbox" id="low-only" style="width:auto" onchange="render()"> Low stock only
    </label>
  </div>

  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th style="width:120px">SKU</th>
          <th style="width:110px">Design</th>
          <th style="width:90px">Size</th>
          <th style="width:90px">Status</th>
          <th style="width:80px">Qty</th>
          <th style="width:80px">Reorder</th>
          <th style="width:80px">W × H</th>
          <th style="width:70px">Area</th>
          <th style="width:80px">Cost/in²</th>
          <th style="width:80px">Unit Cost</th>
          <th style="width:70px">Markup</th>
          <th style="width:80px">Unit Price</th>
          <th style="width:110px">Supplier</th>
          <th style="width:90px">Location</th>
          <th style="width:90px">Updated</th>
          <th style="width:140px">Notes</th>
          <th style="width:90px">Actions</th>
        </tr></thead>
        <tbody id="tbody">
          <tr><td colspan="17"><div class="loading"><div class="spinner"></div>Loading…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="item-modal">
  <div class="modal">
    <div class="modal-hd"><h2 id="modal-title">Add SKU</h2><button class="ghost sm" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">

      <div class="sec-label">Identity</div>
      <div class="fg">
        <label>SKU<input type="text" id="f-sku" placeholder="e.g. DTF-BEAR-SM"></label>
        <label>Design<input type="text" id="f-design" placeholder="e.g. Bear"></label>
      </div>
      <div class="fg" style="margin-top:10px">
        <label>Size<input type="text" id="f-size" placeholder="e.g. Small or 3 in"></label>
        <label>Status<input type="text" id="f-status" list="status-options" placeholder="In Stock"></label>
      </div>
      <datalist id="status-options">
        <option value="In Stock"><option value="Order In"><option value="Low Stock"><option value="Discontinued">
      </datalist>

      <div class="sec-label">Stock levels</div>
      <div class="fg">
        <label>Qty on Hand<input type="number" id="f-qty" value="0"></label>
        <label>Reorder Point<input type="number" id="f-reorder" value="0"></label>
      </div>

      <div class="sec-label">Sizing & cost</div>
      <div class="fg3">
        <label>Width (in)<input type="number" step="0.01" id="f-width" oninput="calcPreview()"></label>
        <label>Height (in)<input type="number" step="0.01" id="f-height" oninput="calcPreview()"></label>
        <label>Cost/sq in<input type="number" step="0.0001" id="f-costsqin" oninput="calcPreview()"></label>
      </div>
      <div class="fg" style="margin-top:10px">
        <label>Markup %<input type="number" step="1" id="f-markup" value="100" oninput="calcPreview()"></label>
        <label>Unit Price (editable)<input type="number" step="0.01" id="f-price" placeholder="auto-suggested"></label>
      </div>
      <div class="calc-box">
        <div><div class="pb-label">Area sq in</div><div class="pb-val" id="calc-area">—</div></div>
        <div><div class="pb-label">Unit Cost</div><div class="pb-val" id="calc-cost">—</div></div>
      </div>

      <div class="sec-label">Sourcing</div>
      <div class="fg">
        <label>Supplier<input type="text" id="f-supplier" placeholder="Falcon Transfers"></label>
        <label>Location<input type="text" id="f-location" placeholder="e.g. Shelf A2"></label>
      </div>

      <div class="sec-label">Notes</div>
      <div class="fl"><textarea id="f-notes" placeholder="Anything worth flagging about this SKU"></textarea></div>

    </div>
    <div class="modal-ft">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" id="save-btn" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===========================================================
   BACKEND CONNECTION
   This is Crystal's real apiCall(), copied verbatim from index.html
   so this page talks to the exact same Apps Script backend.
   =========================================================== */
const API = 'https://script.google.com/macros/s/AKfycbxx8bkn-13BZMS_BH3JTZ-mW4_PiDG-CM8YDmzluB92tdiuZs6b3fSIlDvU_1Z2pVvR/exec';

async function apiCall(params){
  setSyncState('syncing');
  try{
    const r=await fetch(API+'?action='+params.action,{method:'POST',body:JSON.stringify(params)});
    const d=await r.json();
    setSyncState('ok');
    return d;
  }catch(e){setSyncState('error');throw e;}
}

function setSyncState(s){
  const d=document.getElementById('syncDot'),t=document.getElementById('syncTxt');
  d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  t.textContent=s==='syncing'?'Syncing…':s==='error'?'Error':'Connected';
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type==='ok'?'ok':type==='err'?'err':'');
  setTimeout(()=>t.className='toast',3000);
}

function today(){return new Date().toISOString().split('T')[0]}
function fmtMoney(v){return '$'+Number(v||0).toFixed(2)}

/* ===========================================================
   THE TWO EXTERNAL SHEETS
   No sheet/tab name is sent — the backend opens the spreadsheet
   by ID and uses its first tab. Columns are always read by
   HEADER NAME, never by position, so adding/reordering columns
   in the sheet will never break this page.
   =========================================================== */
const SHEETS = {
  dtf: { id: '1ji1kmYAkHeuYngIBmjrwwvHqJircpcRNWwi7Lk5s-5Y', label: 'DTF Transfers', skuHint: 'DTF-BEAR-SM' },
  uv:  { id: '1K6B4aghooqknh-F3xG56TjHsNYNe-TiwiPVa29OpWFs', label: 'UV Stickers',  skuHint: 'BEAR-2IN' }
};
const COLS = ['SKU','Design','Size','Status','Qty on Hand','Reorder Point','Width (in)','Height (in)','Area sq in','Cost/sq in','Unit Cost','Markup %','Unit Price','Supplier','Location','Last Updated','Notes'];

let data = { dtf: [], uv: [] };
let activeTab = 'dtf';
let editKey = null;

async function loadTab(tab){
  const res = await apiCall({ action: 'getSheet', spreadsheetId: SHEETS[tab].id });
  data[tab] = res.rows || res.data || (Array.isArray(res) ? res : []);
}

async function loadAll(){
  try{
    await Promise.all([loadTab('dtf'), loadTab('uv')]);
    render();
    toast('Inventory loaded','ok');
  }catch(e){
    toast('Connection error — check internet','err');
    document.getElementById('tbody').innerHTML = `<tr><td colspan="17"><div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load data</div><div>Check the backend connection and try Refresh</div></div></td></tr>`;
  }
}

async function refreshTab(){
  try{
    await loadTab(activeTab);
    render();
    toast('Refreshed','ok');
  }catch(e){ toast('Error refreshing','err'); }
}

function switchTab(tab, btn){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-title').textContent = SHEETS[tab].label;
  document.getElementById('search').value = '';
  document.getElementById('low-only').checked = false;
  render();
}

function isLow(row){
  const qty = Number(row['Qty on Hand']||0);
  const reorder = Number(row['Reorder Point']||0);
  return reorder > 0 && qty <= reorder;
}

function statusBadgeClass(status){
  const s = (status||'').toLowerCase();
  if(s==='in stock') return 'b-instock';
  if(s==='order in') return 'b-orderin';
  if(s==='discontinued') return 'b-discontinued';
  return 'b-other';
}

function render(){
  const rows = data[activeTab] || [];
  const q = (document.getElementById('search').value||'').toLowerCase();
  const statusFilter = document.getElementById('status-filter').value;
  const lowOnly = document.getElementById('low-only').checked;

  // populate status filter options from whatever statuses actually exist
  const statuses = [...new Set(rows.map(r=>r['Status']).filter(Boolean))];
  const sf = document.getElementById('status-filter');
  const cur = sf.value;
  sf.innerHTML = '<option value="">All statuses</option>' + statuses.map(s=>`<option value="${s}">${s}</option>`).join('');
  sf.value = cur;

  let filtered = rows.filter(r=>{
    if(statusFilter && r['Status']!==statusFilter) return false;
    if(lowOnly && !isLow(r)) return false;
    if(q){
      const hay = [r['SKU'],r['Design'],r['Supplier'],r['Notes'],r['Location']].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const totalQty = rows.reduce((s,r)=>s+(Number(r['Qty on Hand'])||0),0);
  const lowCount = rows.filter(isLow).length;
  const retailValue = rows.reduce((s,r)=>s+(Number(r['Qty on Hand'])||0)*(Number(r['Unit Price'])||0),0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Total SKUs</div><div class="stat-value">${rows.length}</div></div>
    <div class="stat"><div class="stat-label">Low Stock</div><div class="stat-value ${lowCount?'red':'green'}">${lowCount}</div></div>
    <div class="stat"><div class="stat-label">Qty on Hand</div><div class="stat-value">${totalQty}</div></div>
    <div class="stat"><div class="stat-label">Retail Value</div><div class="stat-value accent">${fmtMoney(retailValue)}</div></div>
  `;

  const tb = document.getElementById('tbody');
  if(!filtered.length){
    tb.innerHTML = `<tr><td colspan="17"><div class="empty"><div class="empty-icon">📦</div><div class="empty-title">${rows.length?'No matches':'No SKUs yet'}</div><div>${rows.length?'Try adjusting your filters':'Click "+ Add SKU" to get started'}</div></div></td></tr>`;
    return;
  }

  tb.innerHTML = filtered.map(r=>{
    const low = isLow(r);
    return `<tr>
      <td class="mono">${r['SKU']||''}</td>
      <td style="font-weight:500">${r['Design']||''}</td>
      <td>${r['Size']||'—'}</td>
      <td><span class="badge ${statusBadgeClass(r['Status'])}">${r['Status']||'—'}</span></td>
      <td class="${low?'stock-low':''}">${r['Qty on Hand']||0}</td>
      <td>${r['Reorder Point']||0}</td>
      <td>${r['Width (in)']||'—'} × ${r['Height (in)']||'—'}</td>
      <td>${r['Area sq in']||'—'}</td>
      <td>${r['Cost/sq in']?Number(r['Cost/sq in']).toFixed(4):'—'}</td>
      <td>${fmtMoney(r['Unit Cost'])}</td>
      <td>${r['Markup %']||0}%</td>
      <td style="font-weight:600">${fmtMoney(r['Unit Price'])}</td>
      <td style="font-size:11px;color:var(--text3)">${r['Supplier']||'—'}</td>
      <td>${r['Location']||'—'}</td>
      <td style="font-size:11px;color:var(--text3)">${r['Last Updated']||'—'}</td>
      <td style="font-size:11px;color:var(--text2)">${r['Notes']||'—'}</td>
      <td>
        <button class="sm ghost" onclick="editItem('${r['SKU']}')">Edit</button>
        <button class="sm ghost danger" onclick="deleteItem('${r['SKU']}')">Del</button>
      </td>
    </tr>`;
  }).join('');
}

function calcPreview(){
  const w = +document.getElementById('f-width').value || 0;
  const h = +document.getElementById('f-height').value || 0;
  const costSqIn = +document.getElementById('f-costsqin').value || 0;
  const markup = +document.getElementById('f-markup').value || 0;
  const area = w*h;
  const unitCost = area*costSqIn;
  const suggested = unitCost*(1+markup/100);
  document.getElementById('calc-area').textContent = area ? area.toFixed(2) : '—';
  document.getElementById('calc-cost').textContent = unitCost ? fmtMoney(unitCost) : '—';
  const priceField = document.getElementById('f-price');
  if(!priceField.value || priceField.dataset.auto==='1'){
    priceField.value = suggested ? suggested.toFixed(2) : '';
    priceField.dataset.auto = '1';
  }
}

function openModal(sku=null){
  editKey = sku;
  const hint = SHEETS[activeTab].skuHint;
  if(!sku){
    document.getElementById('modal-title').textContent = 'Add SKU — ' + SHEETS[activeTab].label;
    ['f-sku','f-design','f-size','f-status','f-supplier','f-location','f-notes'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-sku').placeholder = 'e.g. ' + hint;
    document.getElementById('f-qty').value = 0;
    document.getElementById('f-reorder').value = 0;
    document.getElementById('f-width').value = '';
    document.getElementById('f-height').value = '';
    document.getElementById('f-costsqin').value = '';
    document.getElementById('f-markup').value = 100;
    document.getElementById('f-price').value = '';
    document.getElementById('f-price').dataset.auto = '1';
    document.getElementById('calc-area').textContent = '—';
    document.getElementById('calc-cost').textContent = '—';
  }else{
    const item = data[activeTab].find(r=>r['SKU']===sku);
    document.getElementById('modal-title').textContent = 'Edit SKU — ' + SHEETS[activeTab].label;
    document.getElementById('f-sku').value = item['SKU']||'';
    document.getElementById('f-design').value = item['Design']||'';
    document.getElementById('f-size').value = item['Size']||'';
    document.getElementById('f-status').value = item['Status']||'';
    document.getElementById('f-qty').value = item['Qty on Hand']||0;
    document.getElementById('f-reorder').value = item['Reorder Point']||0;
    document.getElementById('f-width').value = item['Width (in)']||'';
    document.getElementById('f-height').value = item['Height (in)']||'';
    document.getElementById('f-costsqin').value = item['Cost/sq in']||'';
    document.getElementById('f-markup').value = item['Markup %']||100;
    document.getElementById('f-price').value = item['Unit Price']||'';
    document.getElementById('f-price').dataset.auto = '0';
    document.getElementById('f-supplier').value = item['Supplier']||'';
    document.getElementById('f-location').value = item['Location']||'';
    document.getElementById('f-notes').value = item['Notes']||'';
    calcPreview();
  }
  document.getElementById('item-modal').classList.add('open');
}

function closeModal(){
  document.getElementById('item-modal').classList.remove('open');
}

function editItem(sku){ openModal(sku); }

async function deleteItem(sku){
  if(!confirm('Delete SKU "'+sku+'"? This removes the row from the live sheet.')) return;
  try{
    await apiCall({ action:'deleteRow', spreadsheetId: SHEETS[activeTab].id, key:'SKU', value: sku });
    data[activeTab] = data[activeTab].filter(r=>r['SKU']!==sku);
    render();
    toast('SKU deleted','ok');
  }catch(e){ toast('Error deleting','err'); }
}

async function saveItem(){
  const sku = document.getElementById('f-sku').value.trim();
  if(!sku){ alert('Please enter a SKU'); return; }

  const btn = document.getElementById('save-btn');
  btn.textContent = 'Saving…'; btn.disabled = true;

  const w = +document.getElementById('f-width').value || 0;
  const h = +document.getElementById('f-height').value || 0;
  const costSqIn = +document.getElementById('f-costsqin').value || 0;
  const area = w*h;
  const unitCost = area*costSqIn;
  const priceField = document.getElementById('f-price').value;
  const unitPrice = priceField ? +priceField : unitCost*(1+(+document.getElementById('f-markup').value||0)/100);

  const row = {
    'SKU': sku,
    'Design': document.getElementById('f-design').value.trim(),
    'Size': document.getElementById('f-size').value.trim(),
    'Status': document.getElementById('f-status').value.trim(),
    'Qty on Hand': +document.getElementById('f-qty').value || 0,
    'Reorder Point': +document.getElementById('f-reorder').value || 0,
    'Width (in)': w,
    'Height (in)': h,
    'Area sq in': area,
    'Cost/sq in': costSqIn,
    'Unit Cost': unitCost,
    'Markup %': +document.getElementById('f-markup').value || 0,
    'Unit Price': unitPrice,
    'Supplier': document.getElementById('f-supplier').value.trim(),
    'Location': document.getElementById('f-location').value.trim(),
    'Last Updated': today(),
    'Notes': document.getElementById('f-notes').value.trim()
  };

  try{
    await apiCall({ action:'saveRow', spreadsheetId: SHEETS[activeTab].id, keyCol:'SKU', row });
    const idx = data[activeTab].findIndex(r=>r['SKU']===sku);
    if(idx>-1) data[activeTab][idx] = row; else data[activeTab].push(row);
    render();
    closeModal();
    toast(editKey ? 'SKU updated' : 'SKU added', 'ok');
  }catch(e){
    toast('Error saving — check connection', 'err');
  }finally{
    btn.textContent = 'Save'; btn.disabled = false;
  }
}

loadAll();
</script>
